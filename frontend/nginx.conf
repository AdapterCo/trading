server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies API calls to the backend-api container (instrucao.md #19 network).
    location /status {
        proxy_pass http://backend-api:8000;
    }
    location /control/ {
        proxy_pass http://backend-api:8000;
    }
    location /health {
        proxy_pass http://backend-api:8000;
    }
}
