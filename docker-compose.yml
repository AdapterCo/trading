# instrucao.md #19 — container set for the operational backend + dashboard.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adaptertrading
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d adaptertrading"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/adaptertrading
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker-execution:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/adaptertrading
    command: ["python", "-m", "app.workers.execution_worker"]
    depends_on:
      postgres:
        condition: service_healthy

  worker-market-data:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://trading:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/adaptertrading
    command: ["python", "-m", "app.workers.market_data_worker"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "80:80"

volumes:
  postgres_data:
